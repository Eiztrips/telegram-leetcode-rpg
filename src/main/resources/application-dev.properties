spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/dev_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:local_password}

spring.jpa.properties.hibernate.generate_statistics=true;

spring.jpa.hibernate.ddl-auto=create-drop
spring.liquibase.enabled=false

logging.level.root=INFO
logging.level.dev.eiztrips.telegramleetcoderpg=DEBUG

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.highlight_sql=true

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.results=TRACE
logging.level.org.hibernate.stat=DEBUG